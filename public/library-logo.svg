<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="libGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="libGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Shield / Badge -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#libGrad)" filter="url(#libGlow)" />
  <!-- Center Spine Guide -->
  <path d="M60 38 L60 84" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left Page -->
  <path d="M60 44 C50 36 34 38 28 41 C26.5 41.8 26 43.2 26 44.8 L26 77 C26 78.5 27.2 79.8 28.8 79.4 C35 77.8 48 76.5 60 84 Z" fill="url(#pageGrad)" />
  <!-- Right Page -->
  <path d="M60 44 C70 36 86 38 92 41 C93.5 41.8 94 43.2 94 44.8 L94 77 C94 78.5 92.8 79.8 91.2 79.4 C85 77.8 72 76.5 60 84 Z" fill="#ffffff" />
  <!-- Golden Bookmark Ribbon Accent -->
  <path d="M60 36 L66 48 L60 45 L54 48 Z" fill="#fbbf24" />
  <path d="M60 30 L60 45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <!-- Subtle Page Lines Left -->
  <line x1="33" y1="52" x2="52" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="33" y1="60" x2="52" y2="58" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="33" y1="68" x2="48" y2="66" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <!-- Subtle Page Lines Right -->
  <line x1="68" y1="50" x2="87" y2="52" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="58" x2="87" y2="60" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <line x1="72" y1="66" x2="87" y2="68" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
</svg>
